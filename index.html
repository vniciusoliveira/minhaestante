<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estante">
<meta name="theme-color" content="#5B3FA8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Minha Estante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
/* Layout: app de uma coluna para celular — cabeçalho fixo, prateleira em grade de capas, barra de abas no rodapé, painéis que sobem de baixo. */
:root{
  --paper:#F3F5F7; --card:#FFFFFF; --ink:#16202B; --muted:#5E6B78; --line:#DCE2E8;
  --stamp:#5B3FA8; --stamp-soft:#ECE7F7; --gold:#B7861C; --ok:#2E7D5B; --danger:#B3261E;
  --shadow:0 1px 2px rgba(22,32,43,.08),0 6px 18px rgba(22,32,43,.08);
  --f-display:"Gloock",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F151C; --card:#18212B; --ink:#E8EDF2; --muted:#93A1AF; --line:#2A3542;
  --stamp:#A891EC; --stamp-soft:#2A2442; --gold:#E0B04A; --ok:#5CC195; --danger:#F2867E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F151C; --card:#18212B; --ink:#E8EDF2; --muted:#93A1AF; --line:#2A3542;
  --stamp:#A891EC; --stamp-soft:#2A2442; --gold:#E0B04A; --ok:#5CC195; --danger:#F2867E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:-.01em;line-height:1;flex:1;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:18px;padding-block:16px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--paper);opacity:.75}

.tools{display:flex;gap:8px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.field input{border:0;background:transparent;outline:none;padding:10px 0;width:100%;min-width:0}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
select.sort{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 10px;max-width:42%}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}

/* lendo agora */
.reading{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.reading::-webkit-scrollbar{display:none}
.rcard{flex:none;width:min(300px,82vw);display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.rcard .cover{width:58px;flex:none}
.rcard .meta{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.rcard .t{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--stamp);border-radius:99px}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* prateleira */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px}
@media (min-width:560px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
.book{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;min-width:0}
.book .t{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars-mini{font-size:11px;color:var(--gold);letter-spacing:1px}

.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:var(--shadow);background:var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08) 60%,transparent)}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10% 10% 16%;color:#fff}
.gen .gt{font-family:var(--f-display);font-size:clamp(11px,3.4vw,17px);line-height:1.08;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.gen .ga{font-size:clamp(8px,2.2vw,11px);letter-spacing:.06em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen .rule{height:1px;background:rgba(255,255,255,.45);margin:6px 0}
.badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:600;padding:2px 6px;border-radius:99px;z-index:1}

/* vazio */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.spines{display:flex;gap:4px;align-items:flex-end;height:64px}
.spines i{display:block;width:14px;border-radius:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--stamp);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#140F24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#140F24}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tab{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{width:60px;height:60px;border-radius:20px;border:0;background:var(--stamp);color:#fff;display:grid;place-items:center;margin:-22px 18px 0;box-shadow:0 8px 20px rgba(91,63,168,.35)}
.fab svg{width:28px;height:28px}

/* painéis */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .head{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet .head h3{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sheet .body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-width:720px;width:100%;margin:0 auto}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.act svg{width:26px;height:26px;color:var(--stamp)}
.act b{font-size:15px}
.act span{font-size:12.5px;color:var(--muted);line-height:1.3}
.act.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.act.wide div{display:flex;flex-direction:column;gap:2px}

.results{display:flex;flex-direction:column;gap:10px}
.res{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.res .cover{width:52px;flex:none}
.res .meta{flex:1;min-width:0}
.res .t{font-weight:600;line-height:1.25}
.res .a{font-size:13px;color:var(--muted)}
.res .x{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.res .add{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--stamp-soft);color:var(--stamp);display:grid;place-items:center}
.res .add svg{width:20px;height:20px}
.note{font-size:12.5px;color:var(--muted)}
.note.ai{display:flex;gap:6px;align-items:center}
.status{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--stamp);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* scanner */
.scan{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#fff}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(78vw,340px);height:150px;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.9)}
.scan .laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#A891EC;box-shadow:0 0 12px #A891EC;animation:lz 1.6s ease-in-out infinite}
@keyframes lz{50%{transform:translateY(-40px)}}
@media (prefers-reduced-motion: reduce){.scan .laser{animation:none}}
.scan .top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.scan .top b{font-family:var(--f-display);font-weight:400;font-size:20px}
.scan .closeb{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.scan .bottom{position:relative;margin-top:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
.scan .msg{font-size:14px;text-align:center;opacity:.9;min-height:1.4em}
.scan .row{display:flex;gap:8px}
.scan .row input{flex:1;min-width:0;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;padding:11px 12px;font-family:var(--f-mono);letter-spacing:.04em}
.scan .row input::placeholder{color:rgba(255,255,255,.6)}
.scan .btn.light{background:#fff;color:#16202B}
.scan .nocam{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center}
.scan .nocam p{max-width:34ch;opacity:.85;margin:0}
.bigshot{width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:#A891EC;color:#16202B;display:grid;place-items:center}
.bigshot svg{width:40px;height:40px}

/* detalhe */
.dhead{display:flex;gap:16px;align-items:flex-start}
.dhead .cover{width:110px;flex:none}
.dhead .meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.dhead h4{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;margin:0;text-wrap:balance;word-break:break-word}
.dhead .a{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.facts .mono{font-family:var(--f-mono)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box label,.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;padding:4px;color:var(--line)}
.stars button svg{width:30px;height:30px}
.stars button.on{color:var(--gold)}
.prog{display:flex;align-items:center;gap:10px}
.prog input[type=range]{flex:1;accent-color:var(--stamp);min-width:0}
.num{width:76px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;font-family:var(--f-mono);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;min-width:0}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.quotes{display:flex;flex-direction:column;gap:8px}
.quote{font-family:var(--f-display);font-size:16px;line-height:1.35;border-left:3px solid var(--stamp);padding:2px 0 2px 12px;display:flex;gap:8px;justify-content:space-between}
.quote button{background:none;border:0;color:var(--muted);flex:none;font-size:18px;line-height:1}
.desc{color:var(--muted);font-size:14px;max-width:65ch}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* estatísticas */
.goal{background:var(--ink);color:var(--paper);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.goal .big{font-family:var(--f-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.goal .big small{font-family:var(--f-body);font-size:16px;opacity:.7}
.goal .bar{background:rgba(255,255,255,.18);height:10px}
.goal .bar i{background:#A891EC}
:root[data-theme="dark"] .goal .bar i{background:var(--stamp)}
.goal .sub{display:flex;justify-content:space-between;font-size:13px;opacity:.8;gap:8px;flex-wrap:wrap}
.goal button{background:rgba(255,255,255,.14);color:inherit;border:0;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:140px;padding-top:18px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.mcol i{display:block;width:100%;background:var(--stamp);border-radius:4px 4px 2px 2px;min-height:2px}
.mcol i.zero{background:var(--line)}
.mcol em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.mcol strong{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--ink)}
.toplist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.toplist li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.toplist li span:last-child{font-family:var(--f-mono);color:var(--muted);flex:none}
.toplist li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Estante<small id="subtitle">Carregando…</small></div>
    <button class="iconbtn" id="btnTheme" aria-label="Alternar tema claro/escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="viewShelf">
    <div id="loadNote" class="banner" hidden></div>
    <div id="readingWrap" hidden>
      <div class="eyebrow" style="margin-bottom:8px">Lendo agora</div>
      <div class="reading" id="reading"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Prateleiras"></div>
    <div class="tools">
      <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filter" type="search" placeholder="Filtrar na estante" aria-label="Filtrar livros"></label>
      <select class="sort" id="sort" aria-label="Ordenar">
        <option value="added">Recentes</option>
        <option value="title">Título</option>
        <option value="author">Autor</option>
        <option value="rating">Nota</option>
      </select>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SHELVES = [
  {id:"reading", label:"Lendo"},
  {id:"want", label:"Quero ler"},
  {id:"read", label:"Lidos"},
  {id:"dnf", label:"Abandonados"},
];
const shelfLabel = id => (SHELVES.find(s => s.id === id) || {}).label || "";
const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const today = () => new Date().toISOString().slice(0,10);
const uid = () => "b_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }

/* ---------- tema ---------- */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
try{ applyTheme(localStorage.getItem("estante.theme")); }catch(e){}
$("#btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; applyTheme(next);
  try{ localStorage.setItem("estante.theme", next); }catch(e){}
};

/* ---------- armazenamento: nuvem do artefato (db) ou local ---------- */
const state = { books:new Map(), settings:{goal:24}, mode:"loading", shelf:"all", sort:"added", filter:"", view:"shelf", openId:null };
const Store = {
  col:null, queues:new Map(),
  async init(){
    let db=null, user=null;
    if (window.claude && typeof window.claude.use === "function") {
      try { [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
    }
    if (db && user) {
      try {
        const id = await user.id();
        if (id) { this.col = db.collection("data/users/" + id); state.mode = "cloud"; this.subscribe(); return; }
      } catch(e){}
    }
    state.mode = "local"; this.loadLocal(); render();
  },
  subscribe(){
    const note = $("#loadNote");
    const timer = setTimeout(()=>{ note.hidden=false; note.textContent = state.books.size ? "Sem conexão com a nuvem agora. O que aparece pode estar desatualizado." : "Ainda não deu para carregar sua estante. Verifique a conexão; ela aparece assim que responder."; }, 10000);
    this.col.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); note.hidden = true; }
      const m = new Map();
      snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "settings") state.settings = {...state.settings, ...v}; else m.set(d.id, {...v, id:d.id}); });
      state.books = m; render();
    }, err => { clearTimeout(timer); note.hidden=false; note.textContent = "A estante na nuvem parou de responder ("+(err&&err.code||"erro")+"). Recarregue a página."; });
    render();
  },
  loadLocal(){
    try{
      const raw = JSON.parse(localStorage.getItem("estante.books") || "[]");
      raw.forEach(b => state.books.set(b.id, b));
      const s = JSON.parse(localStorage.getItem("estante.settings") || "null"); if (s) state.settings = {...state.settings, ...s};
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem("estante.books", JSON.stringify([...state.books.values()])); localStorage.setItem("estante.settings", JSON.stringify(state.settings)); }
    catch(e){ toast("Não consegui salvar neste navegador (armazenamento cheio ou bloqueado)."); }
  },
  write(id, fn){ // uma escrita por vez por documento
    const prev = this.queues.get(id) || Promise.resolve();
    const next = prev.then(fn).catch(e => { console.error(e); toast(e && e.code === "quota_exceeded" ? "A estante atingiu o limite de armazenamento." : "Não consegui salvar. Tente de novo."); });
    this.queues.set(id, next); return next;
  },
  putBook(b){
    const clean = JSON.parse(JSON.stringify(b)); delete clean.id;
    state.books.set(b.id, b); render();
    if (state.mode === "cloud") return this.write(b.id, () => this.col.doc(b.id).set(clean));
    this.saveLocal();
  },
  delBook(id){
    state.books.delete(id); render();
    if (state.mode === "cloud") return this.write(id, () => this.col.doc(id).delete());
    this.saveLocal();
  },
  putSettings(){
    if (state.mode === "cloud") return this.write("settings", () => this.col.doc("settings").set({...state.settings}));
    this.saveLocal();
  }
};
const debouncers = {};
function saveSoon(b, ms=700){ state.books.set(b.id,b); clearTimeout(debouncers[b.id]); debouncers[b.id]=setTimeout(()=>Store.putBook(b),ms); }

/* ---------- Claude (sample) ---------- */
let sample=null, sampleImages=false;
(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) { updateCoverAction(); return; }
  try { sample = await window.claude.use("sample"); } catch(e){}
  if (sample) { try { const l = await sample.limits(); sampleImages = !!(l && l.images); } catch(e){} }
  updateCoverAction();
})();
function updateCoverAction(){ $("#actCover").hidden = !sampleImages; }
async function askClaude(prompt, images){
  if (!sample) throw new Error("no_sample");
  const opts = {modelTier:"default"}; if (images) opts.images = images;
  return await sample.json(prompt, opts);
}

/* ---------- capas ---------- */
function hash(s){ let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); }
const PALETTE = [[231,38,30],[262,40,32],[198,55,26],[160,40,24],[20,55,34],[340,38,30],[42,60,30],[210,30,22],[188,45,28],[290,25,28]];
function genCover(b){
  const [h,s,l] = PALETTE[hash((b.title||"")+(b.authors||[]).join()) % PALETTE.length];
  return `<div class="gen" style="background:linear-gradient(160deg,hsl(${h} ${s}% ${l+8}%),hsl(${h} ${s}% ${l-6}%))"><div class="gt">${esc(b.title||"Sem título")}</div><div><div class="rule"></div><div class="ga">${esc((b.authors||[])[0]||"")}</div></div></div>`;
}
function coverHTML(b, badge){
  const g = genCover(b);
  const img = b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  return `<div class="cover">${g}${img}${badge?`<span class="badge">${esc(badge)}</span>`:""}</div>`;
}
function resizeImage(file, max=360, q=.72){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { const r = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement("canvas");
      c.width = Math.round(im.width*r); c.height = Math.round(im.height*r); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    im.src = url;
  });
}

function toBlob(file, max){
  return new Promise((res, rej) => { const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; im.src=url; });
}

/* ---------- busca de dados do livro ---------- */
function normIsbn(s){ return String(s||"").replace(/[^0-9Xx]/g,"").toUpperCase(); }
function isIsbn(s){ const d = normIsbn(s); return d.length === 13 ? /^97[89]/.test(d) : d.length === 10; }
function fromGoogle(it){
  const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
  const isbn = (ids.find(i=>i.type==="ISBN_13")||ids.find(i=>i.type==="ISBN_10")||{}).identifier || "";
  let cover = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || "";
  cover = cover.replace(/^http:/,"https:").replace("&edge=curl","");
  return { title: v.title + (v.subtitle ? ": " + v.subtitle : ""), authors: v.authors || [], pages: v.pageCount || 0,
    year: parseInt((v.publishedDate||"").slice(0,4)) || null, publisher: v.publisher || "", isbn, cover, description: v.description || "", source:"Google Livros" };
}
async function fetchJSON(url){ const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000); try { const r = await fetch(url,{signal:ctl.signal}); if(!r.ok) throw 0; return await r.json(); } finally { clearTimeout(t); } }
async function searchWeb(q){
  const isbn = isIsbn(q) ? normIsbn(q) : null;
  try {
    const j = await fetchJSON("https://www.googleapis.com/books/v1/volumes?maxResults=12&q=" + encodeURIComponent(isbn ? "isbn:"+isbn : q));
    if (j.items && j.items.length) return j.items.map(fromGoogle);
  } catch(e){}
  try {
    if (isbn) {
      const j = await fetchJSON("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:" + isbn);
      const v = j["ISBN:"+isbn]; if (v) return [{ title:v.title, authors:(v.authors||[]).map(a=>a.name), pages:v.number_of_pages||0, year:parseInt(String(v.publish_date||"").match(/\d{4}/))||null, publisher:(v.publishers||[])[0]?.name||"", isbn, cover:v.cover?.medium||"", description:"", source:"Open Library" }];
    } else {
      const j = await fetchJSON("https://openlibrary.org/search.json?limit=12&q=" + encodeURIComponent(q));
      if (j.docs && j.docs.length) return j.docs.map(d => ({ title:d.title, authors:d.author_name||[], pages:d.number_of_pages_median||0, year:d.first_publish_year||null, publisher:(d.publisher||[])[0]||"", isbn:(d.isbn||[]).find(x=>x.length===13)||"", cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:"", description:"", source:"Open Library" }));
    }
  } catch(e){}
  return null; // null = web indisponível
}
const BOOK_SCHEMA = 'Cada livro: {"title":string,"authors":[string],"pages":number|null,"year":number|null,"publisher":string,"isbn":string,"description":string (1 frase em português)}';
async function searchClaude(q){
  const isbn = isIsbn(q) ? normIsbn(q) : null;
  const prompt = isbn
    ? `Identifique o livro com ISBN ${isbn}. Responda apenas JSON: {"books":[...]} com no máximo 1 livro. ${BOOK_SCHEMA}. Se não tiver segurança de qual livro é esse ISBN, responda {"books":[]}. Não invente.`
    : `Um leitor brasileiro buscou "${q}" na estante de livros. Liste até 6 livros reais que correspondem (prefira edições em português quando existirem). Responda apenas JSON: {"books":[...]}. ${BOOK_SCHEMA}. Deixe isbn vazio se não tiver certeza.`;
  const r = await askClaude(prompt);
  return ((r && r.books) || []).filter(b=>b && b.title).map(b => ({...b, authors: Array.isArray(b.authors)?b.authors:[], pages:+b.pages||0, isbn: isbn || normIsbn(b.isbn), cover:"", source:"Claude"}));
}
async function findBooks(q){
  const web = await searchWeb(q);
  if (web && web.length) return web;
  if (sample) { try { return await searchClaude(q); } catch(e){ if (e && e.code === "not_granted") toast("Sem permissão para consultar o Claude."); } }
  return web === null && !sample ? null : [];
}

/* ---------- adicionar ---------- */
function openSheet(id){ $("#scrim").classList.add("on"); $(id).classList.add("on"); }
function closeSheets(){ document.querySelectorAll(".sheet.on").forEach(s=>s.classList.remove("on")); $("#scrim").classList.remove("on"); state.openId=null; }
$("#scrim").onclick = closeSheets;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheets);
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#scan").hidden) stopScan(); else closeSheets(); } });

$("#btnAdd").onclick = () => { $("#results").innerHTML=""; $("#searchStatus").hidden = true; $("#q").value=""; openSheet("#sheetAdd"); };

let lastResults = [];
function setStatus(html){ const s=$("#searchStatus"); s.hidden=!html; s.innerHTML=html||""; }
async function runSearch(q){
  q = q.trim(); if (!q) return;
  if (!$("#sheetAdd").classList.contains("on")) openSheet("#sheetAdd");
  $("#q").value = q; $("#results").innerHTML = "";
  setStatus(`<span class="spin"></span>Procurando “${esc(q)}”…`);
  const r = await findBooks(q);
  if (r === null) { setStatus("Não consegui consultar nenhuma base de livros daqui. Cadastre à mão."); return; }
  if (!r.length) { setStatus(isIsbn(q) ? `Nenhum livro encontrado para o ISBN ${esc(normIsbn(q))}. Você pode cadastrar à mão.` : "Nada encontrado. Tente outro termo ou cadastre à mão."); if (isIsbn(q)) prefillIsbn = normIsbn(q); return; }
  setStatus(""); renderResults(r);
}
let prefillIsbn = "";
function renderResults(list){
  lastResults = list;
  const ai = list.some(b=>b.source==="Claude");
  $("#results").innerHTML = (ai ? `<div class="note ai">Dados sugeridos pelo Claude. Confira páginas e ISBN depois de adicionar.</div>` : "") + list.map((b,i) => {
    const dup = [...state.books.values()].find(x => (b.isbn && x.isbn === b.isbn) || (x.title||"").toLowerCase() === (b.title||"").toLowerCase());
    return `<div class="res">${coverHTML(b)}<div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc((b.authors||[]).join(", "))}</div><div class="x">${[b.year,b.pages?b.pages+" p.":"",b.isbn].filter(Boolean).map(esc).join(" · ")}</div>${dup?`<div class="note">Já está na sua estante</div>`:""}</div>
      <button class="add" data-add="${i}" aria-label="Adicionar ${esc(b.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button></div>`;
  }).join("");
}
$("#results").onclick = e => { const b = e.target.closest("[data-add]"); if (!b) return; addBook(lastResults[+b.dataset.add]); };
$("#searchForm").onsubmit = e => { e.preventDefault(); runSearch($("#q").value); };

function addBook(data, shelf="want", extra={}){
  const b = { id: uid(), title: data.title||"Sem título", authors: data.authors||[], pages: +data.pages||0, year: data.year||null, publisher: data.publisher||"", isbn: normIsbn(data.isbn), cover: data.cover||"", description: data.description||"", shelf, rating:0, progress:0, started:"", finished:"", notes:"", quotes:[], loan:"", addedAt: Date.now(), source: data.source||"", ...extra };
  Store.putBook(b); closeSheets(); toast(`“${b.title}” entrou em ${shelfLabel(shelf)}`);
  setTimeout(()=>openBook(b.id), 250);
}

/* cadastro manual */
let editCover = "";
$("#actManual").onclick = () => { editCover=""; $("#editForm").reset(); $("#eIsbn").value = prefillIsbn || ""; $("#eCoverNote").textContent=""; closeSheets(); openSheet("#sheetEdit"); setTimeout(()=>$("#eTitle").focus(),260); };
$("#eCoverBtn").onclick = () => $("#eCoverFile").click();
$("#eCoverFile").onchange = async e => { const f=e.target.files[0]; if(!f) return; try{ editCover = await resizeImage(f); $("#eCoverNote").textContent="Foto adicionada"; }catch(_){ $("#eCoverNote").textContent="Não consegui abrir essa imagem"; } e.target.value=""; };
$("#editForm").onsubmit = e => { e.preventDefault(); prefillIsbn="";
  addBook({ title:$("#eTitle").value.trim(), authors:$("#eAuthor").value.split(",").map(s=>s.trim()).filter(Boolean), pages:+$("#ePages").value||0, year:+$("#eYear").value||null, publisher:$("#ePublisher").value.trim(), isbn:$("#eIsbn").value, cover:editCover, source:"manual" }); };

/* foto da capa → Claude */
$("#actCover").onclick = () => $("#fileCover").click();
$("#fileCover").onchange = async e => {
  const f = e.target.files[0]; e.target.value=""; if (!f) return;
  $("#results").innerHTML=""; setStatus(`<span class="spin"></span>O Claude está olhando a capa…`);
  let thumb=""; try{ thumb = await resizeImage(f); }catch(_){}
  try{
    const blob = await toBlob(f, 1200).catch(()=>f);
    const r = await askClaude(`A imagem é a foto da capa (ou lombada) de um livro tirada por um leitor brasileiro. Identifique o livro. Responda apenas JSON: {"books":[...]} com até 3 candidatos, o mais provável primeiro. ${BOOK_SCHEMA}. Se não der para identificar, {"books":[]}.`, [blob]);
    const list = ((r&&r.books)||[]).filter(b=>b&&b.title).map(b=>({...b, authors:Array.isArray(b.authors)?b.authors:[], pages:+b.pages||0, isbn:normIsbn(b.isbn), cover:thumb, source:"Claude"}));
    if (!list.length) { setStatus("Não reconheci essa capa. Tente uma foto mais reta e iluminada, ou busque pelo título."); return; }
    setStatus(""); renderResults(list);
  } catch(err){ setStatus(err && err.code === "not_granted" ? "Sem permissão para enviar a foto ao Claude." : "Não consegui analisar a foto agora. Tente de novo ou busque pelo título."); }
};

/* ---------- scanner ---------- */
let stream=null, scanLoop=null, detector=null, zx=null, scanning=false;
function zxReader(){
  if (zx || !window.ZXing) return zx;
  const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  zx = new ZXing.MultiFormatReader(); zx.setHints(hints); return zx;
}
function decodeCanvas(c){
  const r = zxReader(); if (!r) return null;
  try { const src = new ZXing.HTMLCanvasElementLuminanceSource(c); const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)); return r.decode(bmp).getText(); } catch(e){ return null; }
}
async function detectOn(source){
  if ("BarcodeDetector" in window) {
    try { detector = detector || new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]}); const r = await detector.detect(source); if (r && r[0]) return r[0].rawValue; } catch(e){}
  }
  return null;
}
async function scanImageFile(f){
  $("#scanMsg").textContent = "Lendo o código da foto…";
  const url = URL.createObjectURL(f); const im = new Image(); im.src = url;
  try { await im.decode(); } catch(e){ $("#scanMsg").textContent="Não consegui abrir a foto."; return; }
  let code = await detectOn(im);
  if (!code) {
    for (const max of [1400, 900, 2000]) {
      const r = Math.min(1, max/Math.max(im.width,im.height)); const c = document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); code = decodeCanvas(c); if (code) break;
    }
  }
  URL.revokeObjectURL(url);
  if (code) gotCode(code); else $("#scanMsg").textContent = "Não achei o código nessa foto. Chegue mais perto ou digite o ISBN.";
}
async function startScan(){
  closeSheets(); const sc=$("#scan"); sc.hidden=false; scanning=true; $("#isbnInput").value="";
  $("#scanMsg").textContent = "Abrindo a câmera…";
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw 0;
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    if (!scanning) { stream.getTracks().forEach(t=>t.stop()); return; }
    const v=$("#video"); v.srcObject=stream; v.hidden=false; $("#frame").hidden=false; $("#nocam").hidden=true; await v.play();
    $("#scanMsg").textContent = "Centralize o código de barras no quadro";
    const c = document.createElement("canvas"); const ctx = c.getContext("2d",{willReadFrequently:true});
    const tick = async () => {
      if (!scanning) return;
      let code = await detectOn(v);
      if (!code && v.videoWidth) { // recorte da faixa central
        const w=v.videoWidth, h=v.videoHeight, cw=Math.round(w*.85), ch=Math.round(h*.4);
        c.width=cw; c.height=ch; ctx.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch); code = decodeCanvas(c);
      }
      if (code) { gotCode(code); return; }
      scanLoop = setTimeout(tick, 250);
    };
    tick();
  } catch(e){
    $("#video").hidden=true; $("#frame").hidden=true; $("#nocam").hidden=false;
    $("#scanMsg").textContent = "Toque no botão para fotografar o código";
  }
}
function stopScan(){
  scanning=false; clearTimeout(scanLoop);
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $("#video").srcObject=null; $("#scan").hidden=true;
}
function gotCode(raw){
  const d = normIsbn(raw);
  if (!isIsbn(d)) { $("#scanMsg").textContent = `Li ${d}, mas não é um ISBN de livro. Tente o outro código da contracapa.`; if (scanning && stream) scanLoop=setTimeout(()=>startLoopAgain(),1200); return; }
  try { navigator.vibrate && navigator.vibrate(60); } catch(e){}
  stopScan(); runSearch(d);
}
function startLoopAgain(){ if (scanning) { stopScan(); startScan(); } }
$("#actScan").onclick = startScan;
$("#scanClose").onclick = stopScan;
$("#shotBtn").onclick = () => $("#fileBarcode").click();
$("#fileBarcode").onchange = e => { const f=e.target.files[0]; e.target.value=""; if (f) scanImageFile(f); };
$("#isbnForm").onsubmit = e => { e.preventDefault(); const v=$("#isbnInput").value; if (!v.trim()) return; if (isIsbn(v)) gotCode(v); else { stopScan(); runSearch(v); } };

/* ---------- prateleira ---------- */
function filtered(){
  let list = [...state.books.values()];
  if (state.shelf !== "all") list = list.filter(b => b.shelf === state.shelf);
  const f = state.filter.trim().toLowerCase();
  if (f) list = list.filter(b => (b.title+" "+(b.authors||[]).join(" ")+" "+(b.isbn||"")).toLowerCase().includes(f));
  const by = { added:(a,b)=>(b.addedAt||0)-(a.addedAt||0), title:(a,b)=>a.title.localeCompare(b.title,"pt"), author:(a,b)=>((a.authors||[])[0]||"").localeCompare((b.authors||[])[0]||"","pt"), rating:(a,b)=>(b.rating||0)-(a.rating||0) };
  return list.sort(by[state.sort]);
}
function pct(b){ return b.pages ? Math.min(100, Math.round((b.progress||0)/b.pages*100)) : 0; }
function render(){
  const all = [...state.books.values()];
  const readYear = all.filter(b=>b.shelf==="read" && (b.finished||"").startsWith(String(new Date().getFullYear()))).length;
  $("#subtitle").textContent = state.mode==="loading" ? "Carregando…" : `${all.length} ${all.length===1?"livro":"livros"} · ${readYear} lidos em ${new Date().getFullYear()}`;

  const counts = {all: all.length}; SHELVES.forEach(s => counts[s.id] = all.filter(b=>b.shelf===s.id).length);
  $("#chips").innerHTML = [{id:"all",label:"Todos"},...SHELVES].map(s => `<button class="chip" data-shelf="${s.id}" aria-pressed="${state.shelf===s.id}">${s.label}<span class="n">${counts[s.id]}</span></button>`).join("");

  const reading = all.filter(b=>b.shelf==="reading");
  $("#readingWrap").hidden = !(reading.length && state.shelf==="all" && !state.filter);
  $("#reading").innerHTML = reading.map(b => `<button class="rcard" data-open="${b.id}">${coverHTML(b)}<div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc((b.authors||[]).join(", "))}</div><div class="pct">${b.pages?`p. ${b.progress||0} de ${b.pages} · ${pct(b)}%`:"Sem nº de páginas"}</div><div class="bar"><i style="width:${pct(b)}%"></i></div></div></button>`).join("");

  const list = filtered();
  $("#shelf").innerHTML = list.map(b => `<button class="book" data-open="${b.id}">${coverHTML(b, state.shelf==="all" && b.shelf==="reading" ? pct(b)+"%" : (b.loan ? "Emprestado" : ""))}<div class="t">${esc(b.title)}</div><div class="a">${esc((b.authors||[])[0]||"")}</div>${b.rating?`<div class="stars-mini" aria-label="${b.rating} de 5">${"★".repeat(b.rating)}</div>`:""}</button>`).join("");

  const eb = $("#emptyBox");
  if (state.mode === "loading") eb.innerHTML = `<div class="status"><span class="spin"></span>Abrindo sua estante…</div>`;
  else if (!all.length) eb.innerHTML = `<div class="empty"><div class="spines" aria-hidden="true">${[46,58,40,64,52,36,60].map((h,i)=>`<i style="height:${h}px;background:hsl(${PALETTE[i][0]} ${PALETTE[i][1]}% ${PALETTE[i][2]+12}%)"></i>`).join("")}</div><h3>Sua estante está vazia</h3><p>Escaneie o código de barras de um livro que você tem por perto, ou busque pelo título. Ele aparece aqui com capa, autor e páginas.</p><div class="row-btns"><button class="btn primary" id="emptyScan">Escanear um livro</button><button class="btn ghost" id="emptySearch">Buscar título</button></div>${state.mode==="local"?`<p class="note">Os livros ficam salvos neste aparelho. Use Leituras → Backup para guardar uma cópia.</p>`:""}</div>`;
  else if (!list.length) eb.innerHTML = `<p class="note">Nenhum livro aqui${state.filter?" com esse filtro":""}.</p>`;
  else eb.innerHTML = "";
  const es=$("#emptyScan"); if (es) es.onclick=startScan;
  const ess=$("#emptySearch"); if (ess) ess.onclick=()=>{ $("#btnAdd").click(); setTimeout(()=>$("#q").focus(),260); };

  if (state.view === "stats") renderStats();
  if (state.openId && $("#sheetBook").classList.contains("on") && !document.activeElement?.closest("#bookBody")) renderBook();
}
$("#chips").onclick = e => { const c=e.target.closest("[data-shelf]"); if(!c) return; state.shelf=c.dataset.shelf; render(); };
$("#sort").onchange = e => { state.sort=e.target.value; render(); };
$("#filter").oninput = e => { state.filter=e.target.value; render(); };
document.addEventListener("click", e => { const o=e.target.closest("[data-open]"); if (o) openBook(o.dataset.open); });

/* ---------- detalhe ---------- */
function openBook(id){ state.openId=id; renderBook(); openSheet("#sheetBook"); }
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
function renderBook(){
  const b = state.books.get(state.openId); const body=$("#bookBody");
  if (!b) { closeSheets(); return; }
  body.innerHTML = `
    <div class="dhead">${coverHTML(b)}<div class="meta"><h4>${esc(b.title)}</h4><div class="a">${esc((b.authors||[]).join(", ")||"Autor desconhecido")}</div>
      <div class="facts">${b.year?`<span>${b.year}</span>`:""}${b.pages?`<span>${b.pages} páginas</span>`:""}${b.publisher?`<span>${esc(b.publisher)}</span>`:""}${b.isbn?`<span class="mono">ISBN ${esc(b.isbn)}</span>`:""}</div>
      <button class="btn ghost" id="dCover" style="align-self:flex-start;padding:7px 12px;font-size:13px">${b.cover?"Trocar capa":"Adicionar foto da capa"}</button>
      <input type="file" id="dCoverFile" accept="image/*" capture="environment" hidden></div></div>
    ${b.description?`<p class="desc">${esc(b.description.replace(/<[^>]+>/g,"")).slice(0,420)}${b.description.length>420?"…":""}</p>`:""}
    <div class="seg" role="group" aria-label="Prateleira">${SHELVES.map(s=>`<button data-setshelf="${s.id}" aria-pressed="${b.shelf===s.id}">${s.label}</button>`).join("")}</div>
    ${b.shelf==="reading"||b.shelf==="dnf"?`<div class="box"><span class="lbl">Progresso</span>
      <div class="prog"><input type="range" id="dRange" min="0" max="${b.pages||100}" value="${b.progress||0}" aria-label="Página atual"><input class="num" id="dPage" type="number" inputmode="numeric" min="0" value="${b.progress||0}" aria-label="Página atual"></div>
      <div class="pct" id="dPct">${b.pages?`${pct(b)}% · faltam ${Math.max(0,b.pages-(b.progress||0))} páginas`:"Informe o total de páginas abaixo para ver a porcentagem"}</div></div>`:""}
    <div class="box"><span class="lbl">Sua nota</span><div class="stars" id="dStars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${n<=(b.rating||0)?"on":""}" aria-label="${n} estrela${n>1?"s":""}">${STAR}</button>`).join("")}</div></div>
    <div class="box"><div class="two">
      <div><label for="dStart">Comecei</label><input class="inp" type="date" id="dStart" value="${esc(b.started)}"></div>
      <div><label for="dEnd">Terminei</label><input class="inp" type="date" id="dEnd" value="${esc(b.finished)}"></div></div>
      <div class="two"><div><label for="dPages">Total de páginas</label><input class="inp" type="number" inputmode="numeric" id="dPages" value="${b.pages||""}"></div>
      <div><label for="dLoan">Emprestado para</label><input class="inp" id="dLoan" value="${esc(b.loan)}" placeholder="Ninguém"></div></div></div>
    <div class="box"><label for="dNotes">Anotações</label><textarea class="inp" id="dNotes" placeholder="O que achou, onde parou, ideias…">${esc(b.notes)}</textarea></div>
    <div class="box"><span class="lbl">Trechos favoritos</span>
      <div class="quotes">${(b.quotes||[]).map((q,i)=>`<div class="quote"><span>${esc(q)}</span><button data-delq="${i}" aria-label="Remover trecho">×</button></div>`).join("")}</div>
      <div class="tools"><input class="inp" id="dQuote" placeholder="Copie um trecho que marcou" style="flex:1"><button class="btn ghost" id="dAddQ">Guardar</button></div></div>
    <div class="confirm" id="dDelWrap"><button class="btn danger" id="dDel">Remover da estante</button></div>`;

  const upd = (patch, now) => { const nb = {...state.books.get(b.id), ...patch}; if (now) Store.putBook(nb); else saveSoon(nb); return nb; };
  body.querySelectorAll("[data-setshelf]").forEach(x => x.onclick = () => {
    const s=x.dataset.setshelf, patch={shelf:s};
    if (s==="reading" && !b.started) patch.started = today();
    if (s==="read") { if (!b.finished) patch.finished = today(); if (b.pages) patch.progress = b.pages; }
    upd(patch,true); renderBook(); if (s==="read") toast("Mais um lido! Que tal dar uma nota?");
  });
  body.querySelectorAll("[data-star]").forEach(x => x.onclick = () => { const n=+x.dataset.star; upd({rating: n===b.rating?0:n}, true); renderBook(); });
  const rg=$("#dRange"), pg=$("#dPage");
  const setProg = (v, now) => { const cur=state.books.get(b.id); v=Math.max(0, Math.min(cur.pages||v, +v||0)); const nb=upd({progress:v}, now); if(rg) rg.value=v; if(pg && document.activeElement!==pg) pg.value=v; $("#dPct").textContent = nb.pages?`${pct(nb)}% · faltam ${Math.max(0,nb.pages-v)} páginas`:"";
    if (nb.pages && v>=nb.pages && nb.shelf==="reading") { upd({shelf:"read", finished: nb.finished||today()}, true); toast("Livro concluído e movido para Lidos"); renderBook(); } };
  if (rg) { rg.oninput = () => setProg(rg.value); rg.onchange = () => setProg(rg.value, true); }
  if (pg) pg.onchange = () => setProg(pg.value, true);
  $("#dStart").onchange = e => upd({started:e.target.value}, true);
  $("#dEnd").onchange = e => upd({finished:e.target.value}, true);
  $("#dPages").onchange = e => { upd({pages:+e.target.value||0}, true); renderBook(); };
  $("#dLoan").oninput = e => upd({loan:e.target.value.trim()});
  $("#dNotes").oninput = e => upd({notes:e.target.value});
  $("#dAddQ").onclick = () => { const v=$("#dQuote").value.trim(); if(!v) return; upd({quotes:[...(state.books.get(b.id).quotes||[]), v]}, true); renderBook(); };
  body.querySelectorAll("[data-delq]").forEach(x => x.onclick = () => { const q=[...(state.books.get(b.id).quotes||[])]; q.splice(+x.dataset.delq,1); upd({quotes:q},true); renderBook(); });
  $("#dCover").onclick = () => $("#dCoverFile").click();
  $("#dCoverFile").onchange = async e => { const f=e.target.files[0]; if(!f) return; try{ upd({cover: await resizeImage(f)}, true); renderBook(); }catch(_){ toast("Não consegui abrir essa imagem"); } };
  $("#dDel").onclick = () => { $("#dDelWrap").innerHTML = `<span class="note">Remover “${esc(b.title)}” e suas anotações?</span><button class="btn danger" id="dDelYes">Remover</button><button class="btn ghost" id="dDelNo">Cancelar</button>`;
    $("#dDelYes").onclick = () => { Store.delBook(b.id); closeSheets(); toast("Livro removido"); }; $("#dDelNo").onclick = renderBook; };
}

/* ---------- estatísticas ---------- */
function renderStats(){
  const y = new Date().getFullYear(); const all=[...state.books.values()];
  const read = all.filter(b=>b.shelf==="read");
  const ry = read.filter(b=>(b.finished||"").startsWith(String(y)));
  const goal = state.settings.goal || 24;
  const pagesY = ry.reduce((s,b)=>s+(b.pages||0),0);
  const rated = read.filter(b=>b.rating); const avg = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1).replace(".",",") : "–";
  const byM = Array(12).fill(0); ry.forEach(b=>{ const m=+b.finished.slice(5,7)-1; if(m>=0) byM[m]++; });
  const max = Math.max(1,...byM);
  const doy = Math.floor((Date.now()-new Date(y,0,1))/864e5)+1; const expected = Math.round(goal*doy/365);
  const pace = ry.length - expected;
  const authors = {}; read.forEach(b=>(b.authors||[]).slice(0,1).forEach(a=>authors[a]=(authors[a]||0)+1));
  const topA = Object.entries(authors).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const loans = all.filter(b=>b.loan);
  $("#viewStats").innerHTML = `
    <div class="goal"><div class="eyebrow" style="color:inherit;opacity:.7">Meta de ${y}</div>
      <div class="big">${ry.length} <small>de ${goal} livros</small></div>
      <div class="bar"><i style="width:${Math.min(100,ry.length/goal*100)}%"></i></div>
      <div class="sub"><span>${ry.length>=goal?"Meta batida!":pace>=0?`${pace===0?"No ritmo certo":`${pace} à frente do ritmo`}`:`${-pace} atrás do ritmo`}</span><span><button id="goalMinus" aria-label="Diminuir meta">−</button> meta <button id="goalPlus" aria-label="Aumentar meta">+</button></span></div></div>
    <div class="kpis"><div class="kpi"><b>${pagesY.toLocaleString("pt-BR")}</b><span>páginas em ${y}</span></div><div class="kpi"><b>${read.length}</b><span>lidos no total</span></div><div class="kpi"><b>${avg}</b><span>nota média</span></div></div>
    <div class="box"><span class="lbl">Livros terminados por mês · ${y}</span>
      <div class="months">${byM.map((n,i)=>`<div class="mcol">${n?`<strong>${n}</strong>`:""}<i class="${n?"":"zero"}" style="height:${n/max*100}%"></i><em>${MONTHS[i][0].toUpperCase()}</em></div>`).join("")}</div></div>
    ${topA.length?`<div class="box"><span class="lbl">Autores mais lidos</span><ul class="toplist">${topA.map(([a,n])=>`<li><span>${esc(a)}</span><span>${n}</span></li>`).join("")}</ul></div>`:""}
    ${loans.length?`<div class="box"><span class="lbl">Emprestados</span><ul class="toplist">${loans.map(b=>`<li><span>${esc(b.title)}</span><span>${esc(b.loan)}</span></li>`).join("")}</ul></div>`:""}
    <div class="box"><span class="lbl">Backup</span><p class="note" style="margin:0">${state.mode==="cloud"?"Sua estante está salva na sua conta, privada para você. O backup gera um arquivo para guardar ou levar para outro lugar.":"Sua estante fica salva neste navegador. Faça backup de vez em quando para não perder nada."}</p>
      <div class="row-btns"><button class="btn ghost" id="bExport">Exportar backup</button><button class="btn ghost" id="bImport">Importar backup</button></div>
      <input type="file" id="bFile" accept="application/json,.json" hidden><div class="note" id="bNote"></div></div>`;
  const setGoal = d => { state.settings.goal = Math.max(1,(state.settings.goal||24)+d); Store.putSettings(); renderStats(); };
  $("#goalMinus").onclick=()=>setGoal(-1); $("#goalPlus").onclick=()=>setGoal(1);
  $("#bExport").onclick = exportBackup;
  $("#bImport").onclick = () => $("#bFile").click();
  $("#bFile").onchange = importBackup;
}
async function exportBackup(){
  const data = JSON.stringify({app:"estante", version:1, exportedAt:new Date().toISOString(), settings:state.settings, books:[...state.books.values()]}, null, 1);
  const filename = `estante-${today()}.json`;
  let dl=null; if (window.claude && window.claude.use) { try{ dl = await window.claude.use("downloads"); }catch(e){} }
  if (dl) { try{ await dl.save({filename, data}); $("#bNote").textContent="Backup salvo."; }catch(e){ $("#bNote").textContent = e && e.code==="unavailable" ? "Este visualizador não permite salvar arquivos." : "Backup cancelado."; } return; }
  try { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); $("#bNote").textContent="Backup baixado."; }
  catch(e){ $("#bNote").textContent="Não consegui gerar o arquivo aqui."; }
}
async function importBackup(e){
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const j=JSON.parse(await f.text()); const list = j.books||[]; let n=0;
    for (const b of list) { if (!b || !b.title) continue; const id = b.id && /^b_/.test(b.id) ? b.id : uid(); if (!state.books.has(id)) { await Store.putBook({...b, id}); n++; } }
    if (j.settings && j.settings.goal) { state.settings.goal=j.settings.goal; Store.putSettings(); }
    $("#bNote").textContent = `${n} ${n===1?"livro importado":"livros importados"}.`; render();
  }catch(err){ $("#bNote").textContent="Esse arquivo não é um backup da Estante."; }
}

/* ---------- abas ---------- */
function setView(v){ state.view=v; $("#viewShelf").hidden = v!=="shelf"; $("#viewStats").hidden = v!=="stats";
  $("#tabShelf").setAttribute("aria-current", v==="shelf"?"page":"false"); $("#tabStats").setAttribute("aria-current", v==="stats"?"page":"false");
  if (v==="stats") renderStats(); window.scrollTo(0,0); }
$("#tabShelf").onclick=()=>setView("shelf"); $("#tabStats").onclick=()=>setView("stats");

render();
Store.init();
})();
</script>
